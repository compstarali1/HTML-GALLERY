<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DevGallery | Crystal 3D Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#030308',
                        crystal: 'rgba(255, 255, 255, 0.04)',
                        glass: 'rgba(18, 22, 36, 0.55)',
                        accent: '#00F0FF',
                        secondary: '#8B5CF6',
                        html: '#E85D24',
                        mhtml: '#2563EB',
                        eml: '#3B82F6',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444'
                    },
                    boxShadow: {
                        'crystal': 'inset 0 0 0 1px rgba(255,255,255,0.12), 0 8px 32px rgba(0,0,0,0.4), 0 0 16px rgba(0, 240, 255, 0.1)',
                        'crystal-hover': 'inset 0 0 0 1px rgba(255,255,255,0.2), 0 12px 48px rgba(0,0,0,0.5), 0 0 24px rgba(0, 240, 255, 0.25)',
                        'glow-accent': '0 0 18px rgba(0, 240, 255, 0.5), 0 0 36px rgba(139, 92, 246, 0.25)',
                        'glow-html': '0 0 18px rgba(232, 93, 36, 0.5)',
                        'glow-mhtml': '0 0 18px rgba(37, 99, 235, 0.5)',
                        'float': '0 10px 30px rgba(0,0,0,0.3)'
                    },
                    screens: { 'xs': '480px' }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .perspective-3d { perspective: 1800px; }
            .preserve-3d { transform-style: preserve-3d; }
            .backface-hidden { backface-visibility: hidden; }

            .bg-deep-space {
                background: linear-gradient(-45deg, #020408, #0b0f24, #120f29, #031228);
                background-size: 400% 400%;
                animation: shiftSpace 22s ease infinite;
            }
            @keyframes shiftSpace {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }

            .crystal-glass {
                background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
                backdrop-filter: blur(20px) saturate(180%);
                border: 1px solid rgba(255,255,255,0.1);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(0,0,0,0.15);
            }
            .crystal-glow {
                background: linear-gradient(135deg, rgba(0,240,255,0.12), rgba(139,92,246,0.06));
                border: 1px solid rgba(0,240,255,0.2);
            }

            .float-3d {
                transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
                transform: translateZ(0);
                will-change: transform;
            }
            .float-3d:hover {
                transform: translateZ(28px) rotateX(6deg) rotateY(-6deg) scale(1.03);
            }

            /* Fast, stable thumbnails - no flashing */
            .thumb-frame {
                transform: scale(0.18);
                transform-origin: top left;
                width: 556%;
                height: 556%;
                border: none;
                pointer-events: none;
                user-select: none;
                opacity: 0.75;
                will-change: opacity;
            }
            .thumb-container {
                overflow: hidden;
                width: 100%;
                height: 100%;
                position: relative;
                background: #ffffff;
            }

            /* Sliding controls */
            .modal-header {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                z-index: 20;
                transform: translateY(-100%);
                transition: transform 0.3s ease;
            }
            .modal-header.open {
                transform: translateY(0);
            }
            .modal-trigger {
                position: absolute;
                top: 0;
                right: 0;
                z-index: 21;
                margin: 1rem;
            }

            .scrollbar-crystal {
                scrollbar-width: thin;
                scrollbar-color: rgba(0,240,255,0.6) rgba(255,255,255,0.05);
            }
            .scrollbar-crystal::-webkit-scrollbar { width: 10px; }
            .scrollbar-crystal::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 10px; }
            .scrollbar-crystal::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00F0FF, #8B5CF6); border-radius: 10px; border: 2px solid rgba(255,255,255,0.05); }

            .spinner { animation: spin 1.4s linear infinite; }
            @keyframes spin { 100% { transform: rotate(360deg); } }

            .lazy { opacity: 0; transition: opacity 0.3s ease; }
            .lazy.loaded { opacity: 1; }
        }
    </style>
</head>
<body class="bg-deep-space text-white min-h-screen overflow-x-hidden perspective-3d">

    <!-- Floating Action Buttons -->
    <div class="fixed bottom-6 right-6 z-[100] flex flex-col gap-4">
        <button id="viewSizeBtn" class="crystal-glass w-14 h-14 rounded-full flex items-center justify-center shadow-crystal hover:shadow-crystal-hover text-accent hover:text-white" title="Toggle 1 / 2 per row">
            <i class="fa-solid fa-th-large text-xl"></i>
        </button>
        <button id="addFilesBtn" class="crystal-glass w-14 h-14 rounded-full flex items-center justify-center shadow-crystal hover:shadow-crystal-hover text-success hover:text-white" title="Add Files">
            <i class="fa-solid fa-file-import text-xl"></i>
        </button>
    </div>

    <header class="sticky top-0 z-50 crystal-glass crystal-glow border-b border-accent/20 px-4 xs:px-6 py-4 shadow-glow-accent">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-accent to-secondary flex items-center justify-center shadow-glow-accent">
                    <i class="fa-solid fa-gem text-dark text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl xs:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-accent to-secondary">CRYSTAL GALLERY</h1>
                    <p class="text-[10px] text-accent/70">HTML • MHTML • EML Viewer</p>
                </div>
            </div>
            <button id="sortBtn" class="crystal-glass px-3 py-2 rounded-lg text-sm">
                <i class="fa-solid fa-sort mr-1"></i> <span class="hidden xs:inline">Newest</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pb-20">
        <div id="galleryContainer" class="h-[75vh] overflow-y-auto scrollbar-crystal pr-2 preserve-3d">
            <div id="galleryGrid" class="grid grid-cols-2 gap-4"></div>
        </div>
    </main>

    <!-- Viewer Modal - NO AUTO DOWNLOAD -->
    <div id="htmlModal" class="fixed inset-0 z-[999] hidden items-center justify-center bg-black/70 p-4">
        <div class="relative w-full max-w-5xl h-[85vh] rounded-2xl crystal-glass crystal-glow border border-accent/30 shadow-glow-accent overflow-hidden flex flex-col">
            
            <!-- Sliding Controls Menu -->
            <div id="modalHeader" class="modal-header crystal-glass p-4 border-b border-accent/20">
                <div class="flex flex-wrap justify-between items-center gap-3">
                    <div>
                        <span id="modalFileName" class="text-accent font-bold block truncate max-w-[250px]"></span>
                        <span id="modalFileMeta" class="text-xs text-gray-300"></span>
                    </div>
                    <div class="flex gap-2">
                        <button id="downloadBtn" class="crystal-glass px-3 py-2 rounded-lg text-success hover:shadow-crystal-hover" title="Download File">
                            <i class="fa-solid fa-download mr-1"></i> <span class="hidden sm:inline">Download</span>
                        </button>
                        <button id="printBtn" class="crystal-glass px-3 py-2 rounded-lg text-warning hover:shadow-crystal-hover" title="Print">
                            <i class="fa-solid fa-print mr-1"></i> <span class="hidden sm:inline">Print</span>
                        </button>
                        <button id="zoomBtn" class="crystal-glass px-3 py-2 rounded-lg text-accent hover:shadow-crystal-hover" title="Zoom">
                            <i class="fa-solid fa-search-plus mr-1"></i> <span class="hidden sm:inline">Zoom</span>
                        </button>
                        <button id="closeModalBtn" class="crystal-glass px-3 py-2 rounded-lg text-danger hover:shadow-crystal-hover" title="Close">
                            <i class="fa-solid fa-xmark mr-1"></i> <span class="hidden sm:inline">Close</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Menu Toggle Button -->
            <button id="modalToggleBtn" class="modal-trigger crystal-glass w-12 h-12 rounded-lg flex items-center justify-center text-accent shadow-crystal hover:shadow-crystal-hover">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>

            <!-- Document Display Area -->
            <div class="flex-1 relative overflow-hidden">
                <div id="modalLoader" class="absolute inset-0 flex flex-col items-center justify-center bg-dark/80 z-10 hidden">
                    <i class="fa-solid fa-circle-notch text-accent text-4xl spinner mb-3"></i>
                    <p class="text-accent font-mono">Loading document...</p>
                </div>
                <iframe id="fullFrame" class="w-full h-full border-none bg-white" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"></iframe>
            </div>

            <!-- Navigation -->
            <div class="p-3 crystal-glass border-t border-accent/20 flex justify-between items-center">
                <button id="prevBtn" class="crystal-glass px-4 py-2 rounded-lg hover:shadow-crystal-hover">
                    <i class="fa-solid fa-chevron-left mr-1"></i> Previous
                </button>
                <span id="fileCounter" class="text-accent font-bold">0 / 0</span>
                <button id="nextBtn" class="crystal-glass px-4 py-2 rounded-lg hover:shadow-crystal-hover">
                    Next <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <input type="file" id="htmlFilesInput" accept=".html,.htm,.mhtml,.eml" multiple class="hidden">

    <script>
        let htmlFiles = [];
        let currentIndex = 0;
        let sortNewestFirst = true;
        let viewMode = 'compact';
        let observer;
        let headerOpen = false;

        const galleryGrid = document.getElementById('galleryGrid');
        const htmlFilesInput = document.getElementById('htmlFilesInput');
        const addFilesBtn = document.getElementById('addFilesBtn');
        const sortBtn = document.getElementById('sortBtn');
        const viewSizeBtn = document.getElementById('viewSizeBtn');
        const htmlModal = document.getElementById('htmlModal');
        const fullFrame = document.getElementById('fullFrame');
        const modalLoader = document.getElementById('modalLoader');
        const modalFileName = document.getElementById('modalFileName');
        const modalFileMeta = document.getElementById('modalFileMeta');
        const downloadBtn = document.getElementById('downloadBtn');
        const printBtn = document.getElementById('printBtn');
        const zoomBtn = document.getElementById('zoomBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalToggleBtn = document.getElementById('modalToggleBtn');
        const modalHeader = document.getElementById('modalHeader');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const fileCounter = document.getElementById('fileCounter');

        function initLazyLoad() {
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const iframe = entry.target;
                        iframe.src = iframe.dataset.src;
                        iframe.onload = () => iframe.classList.add('loaded');
                        observer.unobserve(iframe);
                    }
                });
            }, { rootMargin: '200px 0px', threshold: 0.1 });
        }

        function getFileTypeStyles(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            switch(ext) {
                case 'html': case 'htm': return { color: 'text-html', border: 'border-html/30', icon: 'fa-html5' };
                case 'mhtml': return { color: 'text-mhtml', border: 'border-mhtml/30', icon: 'fa-file-contract' };
                case 'eml': return { color: 'text-eml', border: 'border-eml/30', icon: 'fa-envelope' };
                default: return { color: 'text-accent', border: 'border-accent/30', icon: 'fa-file-code' };
            }
        }

        function loadDefaultFile() {
            htmlFiles.push({ name: 'gallexy.html', url: 'gallexy.html', size: 'Default', date: Date.now() });
            renderGallery();
        }

        function loadFiles(files) {
            if (!files.length) return;
            const validFiles = Array.from(files).filter(f => /\.(html|htm|mhtml|eml)$/i.test(f.name));
            const newFiles = validFiles.map(f => ({
                name: f.name,
                url: URL.createObjectURL(f),
                size: (f.size / 1024).toFixed(1) + ' KB',
                date: f.lastModified
            }));
            htmlFiles = [...htmlFiles, ...newFiles].sort((a,b) => sortNewestFirst ? b.date - a.date : a.date - b.date);
            renderGallery();
        }

        function renderGallery() {
            galleryGrid.innerHTML = '';
            galleryGrid.className = viewMode === 'compact' ? 'grid grid-cols-2 gap-4' : 'grid grid-cols-1 gap-6';

            if (htmlFiles.length === 0) {
                galleryGrid.innerHTML = `<div class="crystal-glass rounded-xl p-8 text-center col-span-2">
                    <i class="fa-solid fa-folder-open text-accent/30 text-5xl mb-3"></i>
                    <p class="text-accent/70">Add your HTML/MHTML files</p>
                </div>`;
                return;
            }

            htmlFiles.forEach((file, idx) => {
                const styles = getFileTypeStyles(file.name);
                const heightClass = viewMode === 'compact' ? 'h-56' : 'h-72';

                const card = document.createElement('div');
                card.className = `crystal-glass rounded-xl overflow-hidden ${heightClass} relative border ${styles.border} float-3d cursor-pointer shadow-crystal`;

                card.innerHTML = `
                    <div class="thumb-container">
                        <iframe class="thumb-frame lazy" data-src="${file.url}" sandbox="allow-same-origin"></iframe>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-2 crystal-glass border-t ${styles.border}">
                        <p class="${styles.color} font-semibold font-mono truncate text-sm">${file.name}</p>
                        <p class="text-gray-300 text-xs">${file.size}</p>
                    </div>
                `;

                // ✅ ONLY opens viewer, NO download
                card.onclick = () => { currentIndex = idx; openModal(); };
                galleryGrid.appendChild(card);
            });

            document.querySelectorAll('.lazy').forEach(el => observer.observe(el));
        }

        function openModal() {
            const file = htmlFiles[currentIndex];
            modalFileName.textContent = file.name;
            modalFileMeta.textContent = `${file.size} • ${new Date(file.date).toLocaleString()}`;
            fileCounter.textContent = `${currentIndex + 1} / ${htmlFiles.length}`;
            modalLoader.classList.remove('hidden');
            fullFrame.src = file.url;
            fullFrame.onload = () => modalLoader.classList.add('hidden');
            htmlModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            htmlModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
            fullFrame.src = 'about:blank';
            modalHeader.classList.remove('open');
            headerOpen = false;
        }

        function toggleHeader() {
            headerOpen = !headerOpen;
            modalHeader.classList.toggle('open', headerOpen);
        }

        sortBtn.onclick = () => {
            sortNewestFirst = !sortNewestFirst;
            htmlFiles.sort((a,b) => sortNewestFirst ? b.date - a.date : a.date - b.date);
            renderGallery();
            sortBtn.innerHTML = sortNewestFirst ? `<i class="fa-solid fa-arrow-down mr-1"></i> Newest` : `<i class="fa-solid fa-arrow-up mr-1"></i> Oldest`;
        };

        viewSizeBtn.onclick = () => {
            viewMode = viewMode === 'compact' ? 'single' : 'compact';
            renderGallery();
            viewSizeBtn.innerHTML = viewMode === 'compact' ? `<i class="fa-solid fa-th-large text-xl"></i>` : `<i class="fa-solid fa-th-list text-xl"></i>`;
        };

        // ✅ Download ONLY when button is clicked
        downloadBtn.onclick = () => {
            const file = htmlFiles[currentIndex];
            const a = document.createElement('a');
            a.href = file.url;
            a.download = file.name;
            a.click();
        };

        printBtn.onclick = () => fullFrame.contentWindow?.print();
        zoomBtn.onclick = () => fullFrame.classList.toggle('scale-110');
        closeModalBtn.onclick = closeModal;
        modalToggleBtn.onclick = toggleHeader;
        prevBtn.onclick = () => { currentIndex = (currentIndex - 1 + htmlFiles.length) % htmlFiles.length; openModal(); };
        nextBtn.onclick = () => { currentIndex = (currentIndex + 1) % htmlFiles.length; openModal(); };
        addFilesBtn.onclick = () => htmlFilesInput.click();
        htmlFilesInput.onchange = e => loadFiles(e.target.files);

        initLazyLoad();
        loadDefaultFile();
    </script>

</body>
</html>
